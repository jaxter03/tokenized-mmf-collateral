[package]
name = "devnet-e2e"
version = "0.1.0"
description = "F001-F003 end-to-end runs against devnet"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
mmf-sdk = { path = "../../crates/mmf-sdk" }
mmf-common = { path = "../../crates/mmf-common" }
compliance_hook = { path = "../../programs/compliance_hook", features = ["no-entrypoint"] }
anchor-lang = "=1.1.2"
anchor-spl = { version = "=1.1.2", features = ["token_2022"] }
fund = { path = "../../programs/fund", features = ["no-entrypoint"] }
dvp_settlement = { path = "../../programs/dvp_settlement", features = ["no-entrypoint"] }
solana-rpc-client = "3.1"
solana-rpc-client-api = "3.1"
solana-transaction-status-client-types = "3.1"
solana-commitment-config = "3"
solana-keypair = "3.1"
solana-signer = "3"
solana-transaction = "3"
solana-transaction-error = "3"
solana-message = "3.1"
solana-system-interface = { version = "3.2", features = ["bincode"] }
solana-program-pack = "3"
bs58 = "0.5"
