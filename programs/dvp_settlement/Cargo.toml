[package]
name = "dvp_settlement"
version = "0.1.0"
description = "Escrowed both-or-neither settlement of subscriptions, redemptions and secondary transfers"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "dvp_settlement"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["event-cpi"] }
anchor-spl = { version = "=1.1.2", features = ["token", "token_2022", "token_2022_extensions", "associated_token"] }
mmf-common = { path = "../../crates/mmf-common" }
fund = { path = "../fund", features = ["cpi", "no-entrypoint"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
