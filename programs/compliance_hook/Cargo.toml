[package]
name = "compliance_hook"
version = "0.1.0"
description = "Holder register and the transfer hook for the fund mint"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "compliance_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["event-cpi"] }
anchor-spl = { version = "=1.1.2", features = ["token_2022", "token_2022_extensions", "associated_token"] }
mmf-common = { path = "../../crates/mmf-common" }
spl-transfer-hook-interface = "2.1.0"
spl-discriminator = "0.5"
solana-instructions-sysvar = "3"
spl-tlv-account-resolution = "0.11.4"
sha2 = { version = "0.10", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
