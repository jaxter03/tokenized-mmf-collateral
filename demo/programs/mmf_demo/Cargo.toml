[package]
name = "mmf_demo"
version = "0.1.0"
description = "DEMO ONLY: tokenized MMF pledged to meet a margin call"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mmf_demo"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.1.2"
anchor-spl = { version = "=1.1.2", features = ["token"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
